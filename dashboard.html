<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Dashboard | Education at Glance
    </title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


<header class="topbar">

    <a class="brand"
       href="dashboard.html">

        <img
            src="assets/logo.png"
            alt="Education at Glance">

    </a>


    <nav>

        <a href="courses.html">
            Courses
        </a>

        <a href="profile.html">
            Profile
        </a>

        <button
            class="nav-btn"
            id="logoutBtn">

            Logout

        </button>

    </nav>

</header>


<main class="dashboard">


<section class="welcome">

    <div>

        <span class="eyebrow">
            STUDENT DASHBOARD
        </span>

        <h1 id="welcomeName">
            Welcome
        </h1>

        <p>
            Continue your enrolled courses.
        </p>

    </div>


    <a
        class="btn primary"
        href="courses.html">

        Browse Courses

    </a>

</section>


<section>

    <div class="section-title">

        <span>
            MY LEARNING
        </span>

        <h2>
            Purchased courses
        </h2>

    </div>


    <div
        id="myCourses"
        class="course-grid">
    </div>


    <p
        id="dashMsg"
        class="muted">
    </p>

</section>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="auth.js"></script>

<script src="dashboard.js"></script>


</body>
</html>
